version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - misspell
  disable:
    - staticcheck
    - unused
  settings:
    dogsled:
      max-blank-identifiers: 2
    dupl:
      threshold: 150
    funlen:
      lines: 150
      statements: 80
    gocognit:
      min-complexity: 30
    goconst:
      min-len: 3
      min-occurrences: 5
    gocyclo:
      min-complexity: 25
    godot:
      scope: declarations
      capital: false
    godox:
      keywords:
        - FIXME
        - BUG
    govet:
      enable:
        - shadow
      disable:
        - fieldalignment
    lll:
      line-length: 250
    misspell:
      locale: US
    nestif:
      min-complexity: 6
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocognit
          - gocyclo
          - gosec
          - mnd
          - noctx
          - revive
          - staticcheck
          - unparam
        path: _test\.go
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocognit
          - gocyclo
          - gosec
          - mnd
          - revive
          - staticcheck
          - unparam
        path: examples/
      - linters:
          - errcheck
          - funlen
          - gochecknoinits
          - gosec
          - mnd
          - revive
          - staticcheck
          - unparam
        path: cmd/
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - govet
        text: 'fieldalignment:'
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - staticcheck
        text: 'SA5011:'
      - linters:
          - staticcheck
        text: 'SA9005:'
      - linters:
          - unused
        path: _test\.go
        text: is unused
      - linters:
          - unused
        text: field.*is unused
      - linters:
          - staticcheck
        text: 'ST1005:'
      - linters:
          - staticcheck
        text: 'ST1000:'
      - linters:
          - staticcheck
        text: 'ST1020:'
      - linters:
          - revive
        text: 'package-comments:'
      - linters:
          - revive
        text: 'exported:'
      - linters:
          - revive
        text: 'unused-parameter:'
      - linters:
          - unparam
        path: cmd/
        text: is unused
      - linters:
          - unparam
        text: is unused
        source: func.*\(.*\).*{$
      - linters:
          - errcheck
        source: defer.*\.(Close|Unlock)\(\)
      - linters:
          - errcheck
        source: \.(SetStartNode|AddEndNode|Execute|RegisterTool|RegisterProvider|WriteJSON|Encode)\(
      - linters:
          - gosec
        text: 'G301:|G306:|G304:|G204:|G104:|G302:'
      - linters:
          - rowserrcheck
        text: rows.Err must be checked
      - linters:
          - misspell
        text: cancelled.*canceled
      - linters:
          - whitespace
        text: unnecessary leading newline
      - linters:
          - noctx
        path: _test\.go
    paths:
      - .*_test\.go$
      - examples/.*\.go$
      - cmd/examples/.*\.go$
      - examples/
      - cmd/examples/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - github.com/piotrlaczkowski/GoLangGraph
  exclusions:
    generated: lax
    paths:
      - .*_test\.go$
      - examples/.*\.go$
      - cmd/examples/.*\.go$
      - examples/
      - cmd/examples/
      - third_party$
      - builtin$
      - examples$
