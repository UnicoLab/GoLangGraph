name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: golanggraph
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Run tests
      run: |
        # The whole module: ./pkg/... alone skips the LangGraph conformance
        # suite and the Studio end-to-end suite under ./test/....
        go test -v -race -timeout 15m \
          -coverpkg=./pkg/... -coverprofile=coverage.out -covermode=atomic \
          ./...
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: golanggraph
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Fuzz smoke test
      run: |
        # A short run of each target: enough to catch a regression that makes a
        # fuzz target crash immediately, without lengthening CI.
        set -e
        for pkg_target in \
          "./pkg/core FuzzStateJSONRoundTrip" \
          "./pkg/core FuzzStateMarshalUnmarshal" \
          "./pkg/core FuzzDeepCopy" \
          "./pkg/core FuzzGraphRouting" \
          "./pkg/core FuzzGraphConstruction" \
          "./pkg/tools FuzzToolArguments" \
          "./pkg/tools FuzzPathResolution" \
          "./pkg/tools FuzzCommandPolicy" \
          "./pkg/tools FuzzURLPolicy" \
          "./pkg/server FuzzAPIRequestBodies" \
          "./pkg/server FuzzAPIPaths" ; do
          set -- $pkg_target
          echo "fuzzing $2 in $1"
          go test -run '^$' -fuzz "^$2$" -fuzztime=20s "$1"
        done

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.13.1
        args: --timeout=10m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -no-fail -fmt sarif -out results.sarif ./...

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
      continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Build main binary
      run: |
        CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o bin/golanggraph ./cmd/golanggraph

    - name: Build examples
      run: |
        mkdir -p bin/examples
        go build -o bin/examples/examples ./cmd/examples

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts
        path: bin/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, lint, build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: golanggraph
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: bin/

    - name: Make binaries executable
      run: chmod +x bin/golanggraph bin/examples/examples

    - name: Run integration tests
      run: |
        go test -v -race -timeout 15m ./test/e2e/...
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: golanggraph
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        REDIS_HOST: localhost
        REDIS_PORT: 6379

  docker-e2e:
    name: Docker End-to-End
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Write disposable multi-agent configuration
      run: |
        cat > "$RUNNER_TEMP/multi-agent.yaml" <<'EOF'
        name: docker-ci
        version: "1.0.0"
        agents:
          alpha:
            id: alpha
            name: Alpha
            type: chat
            model: gemma3:1b
            provider: ollama
            systemprompt: "You are the Docker end-to-end smoke-test agent."
            maxtokens: 1000
        deployment:
          type: docker
          environment: production
          replicas: 1
        EOF

    - name: Build production image
      run: docker build -f Dockerfile.agent --tag golanggraph-ci:${{ github.sha }} .

    - name: Start multi-agent container
      run: |
        docker run --detach --name golanggraph-ci \
          --publish 18081:8080 \
          --volume "$RUNNER_TEMP/multi-agent.yaml:/app/configs/multi-agent.yaml:ro" \
          golanggraph-ci:${{ github.sha }} \
          multi-agent serve /app/configs/multi-agent.yaml --host 0.0.0.0 --port 8080

    - name: Verify live health and agent endpoints
      run: |
        set -euo pipefail
        for attempt in $(seq 1 20); do
          if curl --fail --silent --show-error http://127.0.0.1:18081/health > health.json; then
            break
          fi
          sleep 1
        done
        jq -e '.status == "healthy" and .agent_count == 1 and .agents == ["alpha"]' health.json
        curl --fail --silent --show-error http://127.0.0.1:18081/agents > agents.json
        jq -e '.total_count == 1 and .agents[0].id == "alpha" and .agents[0].status == "active"' agents.json

    - name: Print container logs on failure
      if: failure()
      run: docker logs golanggraph-ci

    - name: Remove disposable container and image
      if: always()
      run: |
        docker rm --force golanggraph-ci || true
        docker image rm golanggraph-ci:${{ github.sha }} || true
